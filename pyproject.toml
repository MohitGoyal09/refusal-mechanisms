[project]
name = "safety-refusals"
version = "0.1.0"
description = "Stress-testing whether safety refusals track the intervention or the ambiguity of the request"
readme = "README.md"
authors = [
    { name = "adsingh-64", email = "asingh23@uchicago.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
